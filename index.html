<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela CCU — Classe de Capacidade de Uso do Solo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --azul:#1F6FC0;
    --azul-esc:#175a9f;
    --borda:#c3ccd6;
    --borda-forte:#9aa7b5;
    --texto:#243447;
    --zebra:#f5f8fb;
    --marca:rgba(255,214,10,0.55);
    --marca-borda:#e0b400;
    --x:#243447;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    background:#eef2f6;
    color:var(--texto);
    padding:28px 20px 60px;
  }

  /* ---------- Barra de ferramentas ---------- */
  .toolbar{
    max-width:1180px;
    margin:0 auto 18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:none;
    padding:11px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, transform .05s;
    letter-spacing:.2px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--azul); color:#fff; box-shadow:0 2px 6px rgba(31,111,192,.35);}
  .btn-primary:hover{background:var(--azul-esc);}
  .btn-ghost{background:#fff; color:var(--texto); border:1px solid var(--borda-forte);}
  .btn-ghost:hover{background:#f3f6f9;}
  .hint{font-size:13px; color:#5a6b7c; margin-left:4px;}

  /* ---------- Cartão da tabela ---------- */
  .card{
    max-width:1180px;
    margin:0 auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(30,50,80,.10);
    padding:18px;
    overflow-x:auto;
  }

  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    font-size:12.5px;
    min-width:860px;
  }
  th,td{
    border-right:1px solid var(--borda);
    border-bottom:1px solid var(--borda);
    padding:5px 9px;
  }
  th:first-child, td:first-child{border-left:1px solid var(--borda);}
  tr:first-child th{border-top:1px solid var(--borda);}

  /* Título principal */
  .titulo td{
    background:linear-gradient(180deg,#2478c9,#1F6FC0);
    color:#fff;
    text-align:center;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.4px;
    padding:11px;
    border-color:var(--azul-esc);
  }
  .titulo td:first-child{border-top-left-radius:9px;}
  .titulo td:last-child{border-top-right-radius:9px;}

  /* Linha do nome do imóvel */
  .linha-nome th{
    background:#eaf2fb;
    color:var(--azul-esc);
    font-weight:700;
    text-align:left;
    padding:8px 12px;
  }
  .linha-nome .rot{width:150px; white-space:nowrap;}
  .nome-input{
    width:100%;
    border:none;
    background:transparent;
    color:var(--azul-esc);
    font-weight:700;
    font-size:14px;
    letter-spacing:.5px;
    outline:none;
    text-transform:uppercase;
    padding:2px 0;
  }
  .nome-input::placeholder{color:#9fb9d6; font-weight:600;}
  .nome-input:focus{border-bottom:2px solid var(--azul);}

  /* Cabeçalho das colunas */
  .colhead th{
    background:var(--azul);
    color:#fff;
    font-weight:700;
    text-align:center;
    letter-spacing:.3px;
    padding:7px 6px;
  }
  .colhead .th-fator{text-align:left; width:170px;}
  .colhead .th-caract{text-align:left;}
  .colhead .th-col{width:32px; cursor:pointer; user-select:none;}
  .colhead .th-col:hover{background:var(--azul-esc);}
  .colhead .th-col.marcado{
    background:var(--marca) !important;
    color:var(--x);
    box-shadow:inset 0 0 0 2px var(--marca-borda);
  }

  /* Células de dados */
  .fator{
    text-align:left;
    font-weight:700;
    vertical-align:middle;
    background:#fbfcfe;
    color:var(--azul-esc);
    line-height:1.25;
    white-space:normal;
    width:170px;
  }
  .caract{
    text-align:left;
    white-space:nowrap;
    color:var(--texto);
  }
  tbody tr:nth-child(even) .caract{background:var(--zebra);}
  tbody tr:hover .caract{background:#eef5fc;}

  .cel{
    width:32px;
    text-align:center;
    cursor:pointer;
    position:relative;
    font-weight:700;
    color:var(--x);
    user-select:none;
    height:24px;
  }
  tbody tr:nth-child(even) .cel{background:var(--zebra);}
  .cel:hover{outline:2px solid rgba(31,111,192,.25); outline-offset:-2px;}

  /* Realce amarelo — o que o usuário marca. Os X permanecem fixos. */
  .cel.marcado{
    background:var(--marca) !important;
    box-shadow:inset 0 0 0 2px var(--marca-borda);
  }

  .cinza{background:#eef1f4 !important;}

  /* Rodapé de legenda */
  .legenda{
    max-width:1180px;
    margin:14px auto 0;
    font-size:12.5px;
    color:#5a6b7c;
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    align-items:center;
  }
  .chip{display:inline-flex; align-items:center; gap:7px;}
  .swX{font-weight:700; color:var(--x); border:1px solid var(--borda); border-radius:4px; padding:1px 7px; background:#fff;}
  .swY{width:22px; height:16px; border-radius:3px; background:var(--marca); box-shadow:inset 0 0 0 2px var(--marca-borda); display:inline-block;}
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn btn-primary" onclick="gerarPrint()">🖨️ Gerar Print JPG</button>
  <button class="btn btn-ghost" onclick="limpar()">Limpar realces</button>
  <span class="hint">Clique nas colunas I–VIII para realçar em amarelo. Uma marcação por linha.</span>
</div>

<div class="card">
  <table id="tabelaCCU"></table>
</div>

<div class="legenda">
  <span class="chip"><span class="swX">X</span> Valor fixo do modelo (referência da classe)</span>
  <span class="chip"><span class="swY"></span> Sua marcação</span>
</div>

<script>
/* Cada linha: [caracteristica, colunaComX(fixa), cinzaCols(opcional)] */
const fatores = [
  ["1. Fertilidade natural ou produtividade aparente", [
    ["a. Muito alta > 70 %", 1],
    ["b. Alta - 50 % a 70 %", 1],
    ["c. Média - 30 % a 50 %", 3],
    ["d. Baixa - 10 % a 30 %", 4],
    ["d. Muito baixa < 10 %", 6],
  ]],
  ["2. Profundidade efetiva", [
    ["a. Muito profundo > 200 cm", 1],
    ["b. Profundo - 100cm a 200 cm", 2],
    ["c. Moderadamente profundo - 50 cm a 100cm", 3],
    ["e. Raso - 25 cm 50 cm", 4],
    ["d. Muito raso < 25 cm", 8],
  ]],
  ["3. Drenagem interna", [
    ["a. Excessiva", 3],
    ["b. Forte", 3],
    ["c. Acentuada", 3],
    ["d. Bem drenado", 1],
    ["e. Moderada", 3],
    ["f. Imperfeita", 4],
    ["g. Mal drenado", 6],
    ["h. Muito mal drenado", 8],
  ]],
  ["4. Deflúvio superficial", [
    ["a. Muito rápido", 5],
    ["b. Rápido", 4],
    ["c. Moderado", 3],
    ["d. Lento", 1],
    ["e. Muito lento", 3],
  ]],
  ["5. Pedregosidade", [
    ["a. Sem pedras", 1],
    ["b. Ligeiramente pedregoso < 1%", 3],
    ["c. Moderadamente pedregoso 1% a 10%", 4],
    ["d. Pedregoso 10% a 30%", 5],
    ["e. Muito pedregoso 30% a 50%", 6],
    ["f. Extremamente pedregoso > 50%", 7],
  ]],
  ["6. Riscos de Inundação", [
    ["a. Ausente", 1],
    ["b. Ocasional", 4],
    ["c. Frequente", 6],
    ["d. Muito frequente", 8],
  ]],
  ["7. Classe de declividade", [
    ["a. < 2%", 1],
    ["b. 2% a 6%", 3],
    ["c. 6% a 12%", 4],
    ["d. 12% a 20%", 5],
    ["e. 20% a 40%", 6],
    ["f. > 40%", 7],
  ]],
  ["8. Grau de erosão laminar", [
    ["a. Não aparente", 1],
    ["b. Ligeira", 3],
    ["c. Moderada", 4],
    ["d. Severa", 6],
    ["e. Muito severa", 8],
  ]],
  ["9. Sulcos rasos", [
    ["a. Ocasionais", 3],
    ["b. Frequentes", 4],
    ["c. Muito frequentes", 5],
  ]],
  ["10. Sulcos médios", [
    ["a. Ocasionais", 3],
    ["b. Frequentes", 5],
    ["c. Muito frequentes", 6],
  ]],
  ["11. Sulcos profundos", [
    ["a. Ocasionais", 5],
    ["b. Frequentes", 6],
    ["c. Muito frequentes", 7],
  ]],
  ["12. Voçorocas", [
    ["a. Crateras, buracos, fendas", 8],
  ]],
  ["13. Seca edafológica", [
    ["a. Muito longa", 0],
    ["b. Longa", 8],
    ["c. Média", 6],
    ["d. Curta", 4],
    ["e. Muito curta", 1],
  ]],
];

const romanos = ["I","II","III","IV","V","VI","VII","VIII"];

function construirTabela(){
  const t = document.getElementById("tabelaCCU");
  let html = `
    <thead>
      <tr class="titulo"><td colspan="10">TABELA DE DETERMINAÇÃO DE CLASSE DE CAPACIDADE DE USO DO SOLO (CCU)</td></tr>
      <tr class="linha-nome">
        <th class="rot">Gleba hectare(s)</th>
        <th colspan="9"><input class="nome-input" type="text" placeholder="Digite o nome do imóvel"></th>
      </tr>
      <tr class="colhead">
        <th class="th-fator">Fator limitante</th>
        <th class="th-caract">Característica</th>`;
  romanos.forEach(r => html += `<th class="th-col" onclick="marcarHead(this)">${r}</th>`);
  html += `</tr></thead><tbody>`;

  fatores.forEach(([fator, linhas], fi) => {
    linhas.forEach((linha, li) => {
      const [caract, colX, cinzaCols] = linha;
      html += `<tr data-fator="${fi}">`;
      if(li === 0){
        html += `<td class="fator" rowspan="${linhas.length}">${fator}</td>`;
      }
      html += `<td class="caract">${caract}</td>`;
      for(let c=1;c<=8;c++){
        const temX   = (c === colX) ? "X" : "";
        const cinza  = (cinzaCols && cinzaCols.includes(c)) ? "cinza" : "";
        html += `<td class="cel ${cinza}" data-col="${c}" onclick="marcar(this)">${temX}</td>`;
      }
      html += `</tr>`;
    });
  });
  html += `</tbody>`;
  t.innerHTML = html;
}

/* Marcação = realce amarelo. Os X ficam fixos e nunca se movem. */
function marcar(cel){
  const linha = cel.parentElement;
  const jaMarcado = cel.classList.contains("marcado");
  linha.querySelectorAll(".cel").forEach(c => c.classList.remove("marcado"));
  if(!jaMarcado) cel.classList.add("marcado"); // clicar de novo remove
}

function limpar(){
  document.querySelectorAll("#tabelaCCU .cel.marcado, #tabelaCCU .th-col.marcado").forEach(c => c.classList.remove("marcado"));
}

/* Realce independente em cada cabeçalho de classe (I–VIII) */
function marcarHead(th){
  th.classList.toggle("marcado");
}

/* ---------------- Print em JPG ---------------- */
function baixarCanvas(canvas, nome){
  const link = document.createElement("a");
  link.download = nome;
  link.href = canvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

async function gerarPrint(){
  const original = document.getElementById("tabelaCCU");
  const clone = original.cloneNode(true);
  clone.removeAttribute("id");

  // input -> texto para render fiel
  clone.querySelectorAll("input").forEach(inp=>{
    const span = document.createElement("span");
    span.textContent = inp.value || "Imóvel não identificado";
    span.style.cssText = "color:#175a9f;font-weight:700;text-transform:uppercase;letter-spacing:.5px;";
    inp.replaceWith(span);
  });

  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;background:#fff;padding:16px;width:1120px;";
  const card = document.createElement("div");
  card.className = "card";
  card.style.cssText = "box-shadow:none;padding:0;overflow:visible;max-width:none;";
  card.appendChild(clone);
  holder.appendChild(card);
  document.body.appendChild(holder);

  const canvas = await html2canvas(holder, {scale:2, backgroundColor:"#ffffff"});
  baixarCanvas(canvas, "tabela_CCU.jpg");
  document.body.removeChild(holder);
}

construirTabela();
</script>
</body>
</html>
