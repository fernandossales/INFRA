<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Fotográfico de Campo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --azul:#1F6FC0;
    --azul-esc:#175a9f;
    --azul-infra:#0a4d7c;
    --borda:#c3ccd6;
    --borda-forte:#9aa7b5;
    --texto:#243447;
    --cinza:#5a6b7c;
    --verde:#1a9c3e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    background:#eef2f6;
    color:var(--texto);
    padding:28px 20px 60px;
  }

  /* ---------- Barra de ferramentas ---------- */
  .toolbar{
    max-width:900px;
    margin:0 auto 18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:none;
    padding:11px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, transform .05s;
    letter-spacing:.2px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--azul); color:#fff; box-shadow:0 2px 6px rgba(31,111,192,.35);}
  .btn-primary:hover{background:var(--azul-esc);}
  .btn-verde{background:var(--verde); color:#fff; box-shadow:0 2px 6px rgba(26,156,62,.35);}
  .btn-verde:hover{background:#158234;}
  .btn-ghost{background:#fff; color:var(--texto); border:1px solid var(--borda-forte);}
  .btn-ghost:hover{background:#f3f6f9;}
  .hint{font-size:13px; color:#5a6b7c; margin-left:4px; flex-basis:100%;}

  /* ---------- Campos da capa ---------- */
  .config{
    max-width:900px;
    margin:0 auto 18px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(30,50,80,.08);
    padding:16px 18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 16px;
  }
  .config h3{grid-column:1/-1; margin:0 0 2px; color:var(--azul-esc); font-size:15px;}
  .campo{display:flex; flex-direction:column; gap:4px;}
  .campo.full{grid-column:1/-1;}
  .campo label{font-size:12px; font-weight:600; color:var(--cinza);}
  .campo input{
    border:1px solid var(--borda-forte); border-radius:7px; padding:8px 10px;
    font-size:14px; color:var(--texto); font-family:inherit; outline:none;
  }
  .campo input:focus{border-color:var(--azul);}

  /* ---------- Área de páginas (preview) ---------- */
  .paginas{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:22px;}

  .pagina{
    background:#fff;
    border-radius:8px;
    box-shadow:0 8px 24px rgba(30,50,80,.12);
    aspect-ratio:210/297;
    padding:34px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* Cabeçalho com logos */
  .cabecalho{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:14px; border-bottom:2px solid var(--azul);
  }
  .cabecalho img{height:34px; object-fit:contain;}
  .cabecalho .infra{height:30px;}

  /* Rodapé */
  .rodape{
    margin-top:auto; padding-top:10px; border-top:2px solid var(--azul);
    font-size:8px; color:var(--cinza); display:flex; justify-content:space-between; gap:10px;
  }
  .rodape .end{line-height:1.5;}
  .rodape .tel{line-height:1.5; text-align:right; white-space:nowrap;}

  /* ---------- Capa ---------- */
  .capa-corpo{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px;}
  .capa-titulo{font-size:26px; font-weight:700; color:var(--texto); letter-spacing:.5px;}
  .capa-sub{font-size:16px; color:var(--cinza); max-width:80%; line-height:1.5;}
  .capa-meta{font-size:13px; color:var(--cinza); line-height:1.9; margin-top:10px;}
  .capa-meta b{color:var(--azul-esc);}

  /* ---------- Páginas de fotos ---------- */
  .fotos-corpo{flex:1; display:flex; flex-direction:column; gap:18px; padding:20px 0;}
  .foto-bloco{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    border:1px solid var(--borda); border-radius:8px; padding:10px; background:#fbfcfe;
    min-height:0;
  }
  .foto-num{
    align-self:flex-start; background:var(--azul); color:#fff; font-size:12px; font-weight:700;
    padding:2px 12px; border-radius:20px;
  }
  .foto-frame{
    flex:1; width:100%; display:flex; align-items:center; justify-content:center;
    background:#eef2f6; border-radius:6px; overflow:hidden; min-height:0;
    /* proporção 4x3 controlada via wrapper */
  }
  .foto-frame img{max-width:100%; max-height:100%; object-fit:contain;}
  .foto-frame .vazio{color:#9aa7b5; font-size:13px;}
  .foto-legenda{
    width:100%; border:1px solid var(--borda-forte); border-radius:6px; padding:7px 10px;
    font-size:12.5px; color:var(--texto); font-family:inherit; resize:none; outline:none; min-height:38px;
  }
  .foto-legenda:focus{border-color:var(--azul);}

  .del-foto{
    position:absolute; top:6px; right:6px; background:#e04646; color:#fff; border:none;
    width:24px; height:24px; border-radius:50%; cursor:pointer; font-weight:700; font-size:13px; line-height:1;
  }

  .vazio-msg{
    max-width:900px; margin:0 auto; text-align:center; color:var(--cinza);
    background:#fff; border-radius:12px; padding:40px; box-shadow:0 6px 18px rgba(30,50,80,.08);
  }

  input[type=file]{display:none;}
</style>
</head>
<body>

<div class="toolbar">
  <label class="btn btn-primary" for="inputFotos">📷 Inserir Fotos</label>
  <input type="file" id="inputFotos" accept="image/*" multiple onchange="adicionarFotos(event)">
  <button class="btn btn-verde" onclick="gerarPDF()">📄 Gerar PDF Unificado</button>
  <button class="btn btn-ghost" onclick="limparTudo()">Limpar tudo</button>
  <span class="hint">Selecione várias imagens de uma vez. São dispostas 2 por página (proporção 4×3), com numeração e campo de texto abaixo de cada foto.</span>
</div>

<div class="config">
  <h3>Dados da Capa</h3>
  <div class="campo full">
    <label>Título do relatório</label>
    <input id="cfgTitulo" type="text" value="ANEXO 4: RELATÓRIO FOTOGRÁFICO">
  </div>
  <div class="campo full">
    <label>Nome do imóvel / objeto</label>
    <input id="cfgImovel" type="text" placeholder="Ex.: Fazenda Boa Vista">
  </div>
  <div class="campo">
    <label>Município / UF</label>
    <input id="cfgLocal" type="text" placeholder="Ex.: Fortaleza / CE">
  </div>
  <div class="campo">
    <label>Data</label>
    <input id="cfgData" type="text" placeholder="Ex.: Julho / 2026">
  </div>
  <div class="campo">
    <label>Responsável</label>
    <input id="cfgResp" type="text" placeholder="Ex.: Eng. Fulano de Tal">
  </div>
  <div class="campo">
    <label>Nº do documento / processo</label>
    <input id="cfgDoc" type="text" placeholder="Opcional">
  </div>
</div>

<div class="paginas" id="paginas"></div>

let fotos = []; // {src, legenda}

function cabecalhoHTML(){
  return `<div class="cabecalho">
    <img class="infra" src="${LOGO_INFRA}" alt="INFRA">
    <img src="${LOGO_ENPROL}" alt="ENPROL">
  </div>`;
}
function rodapeHTML(){
  return `<div class="rodape">
    <div class="end">${RODAPE_END.join("<br>")}</div>
    <div class="tel">${RODAPE_TEL.join("<br>")}</div>
  </div>`;
}

function render(){
  const cont = document.getElementById("paginas");
  cont.innerHTML = "";

  // ---- CAPA ----
  const capa = document.createElement("div");
  capa.className = "pagina";
  capa.innerHTML = cabecalhoHTML() + `
    <div class="capa-corpo">
      <div class="capa-titulo" id="pvTitulo"></div>
      <div class="capa-sub" id="pvImovel"></div>
      <div class="capa-meta" id="pvMeta"></div>
    </div>` + rodapeHTML();
  cont.appendChild(capa);
  atualizarCapa();

  // ---- PÁGINAS DE FOTOS (2 por página) ----
  for(let i=0; i<fotos.length; i+=2){
    const pag = document.createElement("div");
    pag.className = "pagina";
    let corpo = `<div class="fotos-corpo">`;
    for(let j=i; j<Math.min(i+2, fotos.length); j++){
      const f = fotos[j];
      corpo += `
        <div class="foto-bloco">
          <button class="del-foto" onclick="removerFoto(${j})" title="Remover">×</button>
          <span class="foto-num">Foto ${j+1}</span>
          <div class="foto-frame">
            ${f.src ? `<img src="${f.src}">` : `<span class="vazio">sem imagem</span>`}
          </div>
          <textarea class="foto-legenda" placeholder="Descrição da foto ${j+1}..."
            oninput="fotos[${j}].legenda=this.value">${f.legenda||""}</textarea>
        </div>`;
    }
    corpo += `</div>`;
    pag.innerHTML = cabecalhoHTML() + corpo + rodapeHTML();
    cont.appendChild(pag);
  }

  if(fotos.length === 0){
    const aviso = document.createElement("div");
    aviso.className = "vazio-msg";
    aviso.textContent = "Nenhuma foto inserida ainda. Clique em “Inserir Fotos” para começar.";
    cont.appendChild(aviso);
  }
}

function atualizarCapa(){
  const titulo = document.getElementById("cfgTitulo").value || "RELATÓRIO FOTOGRÁFICO";
  const imovel = document.getElementById("cfgImovel").value;
  const local  = document.getElementById("cfgLocal").value;
  const data   = document.getElementById("cfgData").value;
  const resp   = document.getElementById("cfgResp").value;
  const doc    = document.getElementById("cfgDoc").value;

  const t = document.getElementById("pvTitulo");
  const im = document.getElementById("pvImovel");
  const mt = document.getElementById("pvMeta");
  if(!t) return;
  t.textContent = titulo;
  im.textContent = imovel || "";
  let meta = "";
  if(local) meta += `<div><b>Local:</b> ${local}</div>`;
  if(data)  meta += `<div><b>Data:</b> ${data}</div>`;
  if(resp)  meta += `<div><b>Responsável:</b> ${resp}</div>`;
  if(doc)   meta += `<div><b>Documento:</b> ${doc}</div>`;
  mt.innerHTML = meta;
}

["cfgTitulo","cfgImovel","cfgLocal","cfgData","cfgResp","cfgDoc"].forEach(id=>{
  document.getElementById(id).addEventListener("input", atualizarCapa);
});

function adicionarFotos(ev){
  const arquivos = [...ev.target.files];
  let pendentes = arquivos.length;
  if(!pendentes) return;
  arquivos.forEach(arq=>{
    const reader = new FileReader();
    reader.onload = e=>{
      fotos.push({src:e.target.result, legenda:""});
      pendentes--;
      if(pendentes===0) render();
    };
    reader.readAsDataURL(arq);
  });
  ev.target.value = "";
}

function removerFoto(i){
  fotos.splice(i,1);
  render();
}

function limparTudo(){
  if(fotos.length && !confirm("Remover todas as fotos?")) return;
  fotos = [];
  render();
}

/* ---------------- Gerar PDF ---------------- */
async function carregarImg(src){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.crossOrigin = "anonymous";
    img.src = src;
  });
}

async function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, H = 297;
  const mL = 15, mR = 15, mT = 12, mB = 12;
  const contentW = W - mL - mR;

  const imgInfra = await carregarImg(LOGO_INFRA);
  const imgEnprol = await carregarImg(LOGO_ENPROL);

  function desenharCabecalho(){
    const hLogo = 10;
    // INFRA à esquerda
    let wI = hLogo * (imgInfra.width/imgInfra.height);
    pdf.addImage(imgInfra, "JPEG", mL, mT, wI, hLogo);
    // ENPROL à direita
    let wE = hLogo * (imgEnprol.width/imgEnprol.height);
    pdf.addImage(imgEnprol, "JPEG", W-mR-wE, mT, wE, hLogo);
    // linha
    pdf.setDrawColor(31,111,192); pdf.setLineWidth(0.6);
    pdf.line(mL, mT+hLogo+3, W-mR, mT+hLogo+3);
  }

  function desenharRodape(){
    const yLinha = H - mB - 22;
    pdf.setDrawColor(31,111,192); pdf.setLineWidth(0.6);
    pdf.line(mL, yLinha, W-mR, yLinha);
    pdf.setFontSize(6); pdf.setTextColor(90,107,124);
    let y = yLinha + 3.5;
    for(let i=0;i<RODAPE_END.length;i++){
      pdf.text(RODAPE_END[i], mL, y);
      pdf.text(RODAPE_TEL[i], W-mR, y, {align:"right"});
      y += 3.4;
    }
  }

  // ---- CAPA ----
  desenharCabecalho();
  const titulo = document.getElementById("cfgTitulo").value || "RELATÓRIO FOTOGRÁFICO";
  const imovel = document.getElementById("cfgImovel").value;
  const local  = document.getElementById("cfgLocal").value;
  const data   = document.getElementById("cfgData").value;
  const resp   = document.getElementById("cfgResp").value;
  const doc    = document.getElementById("cfgDoc").value;

  pdf.setTextColor(36,52,71);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(20);
  pdf.text(titulo, W/2, 120, {align:"center", maxWidth:contentW});

  if(imovel){
    pdf.setFont("helvetica","normal"); pdf.setFontSize(14);
    pdf.setTextColor(90,107,124);
    pdf.text(imovel, W/2, 138, {align:"center", maxWidth:contentW});
  }
  let ym = 158;
  pdf.setFontSize(11);
  const metas = [];
  if(local) metas.push(["Local", local]);
  if(data)  metas.push(["Data", data]);
  if(resp)  metas.push(["Responsável", resp]);
  if(doc)   metas.push(["Documento", doc]);
  metas.forEach(([k,v])=>{
    pdf.setTextColor(23,90,159); pdf.setFont("helvetica","bold");
    const kt = k+": ";
    const kw = pdf.getTextWidth(kt);
    pdf.setTextColor(90,107,124); pdf.setFont("helvetica","normal");
    const vw = pdf.getTextWidth(v);
    const startX = W/2 - (kw+vw)/2;
    pdf.setTextColor(23,90,159); pdf.setFont("helvetica","bold");
    pdf.text(kt, startX, ym);
    pdf.setTextColor(90,107,124); pdf.setFont("helvetica","normal");
    pdf.text(v, startX+kw, ym);
    ym += 7;
  });
  desenharRodape();

  // ---- PÁGINAS DE FOTOS ----
  const topFotos = mT + 10 + 6;         // abaixo do cabeçalho
  const botFotos = H - mB - 22 - 4;     // acima do rodapé
  const areaH = botFotos - topFotos;
  const gap = 6;
  const blocoH = (areaH - gap) / 2;     // altura para cada bloco (foto+legenda)
  const legendaH = 14;                  // altura reservada p/ legenda

  for(let i=0; i<fotos.length; i+=2){
    pdf.addPage();
    desenharCabecalho();
    for(let j=i; j<Math.min(i+2, fotos.length); j++){
      const idx = j - i; // 0 ou 1
      const blocoTop = topFotos + idx*(blocoH+gap);
      const f = fotos[j];

      // Numeração
      pdf.setFont("helvetica","bold"); pdf.setFontSize(10);
      pdf.setTextColor(255,255,255);
      pdf.setFillColor(31,111,192);
      const tag = "Foto "+(j+1);
      const tagW = pdf.getTextWidth(tag)+8;
      pdf.roundedRect(mL, blocoTop, tagW, 6, 3, 3, "F");
      pdf.text(tag, mL+4, blocoTop+4.2);

      // Área da imagem — proporção 4x3
      const imgAreaTop = blocoTop + 8;
      const imgAreaH = blocoH - 8 - legendaH;
      // caixa 4:3 centralizada dentro da área disponível
      let boxW = contentW;
      let boxH = boxW * 3/4;
      if(boxH > imgAreaH){ boxH = imgAreaH; boxW = boxH * 4/3; }
      const boxX = mL + (contentW - boxW)/2;
      const boxY = imgAreaTop + (imgAreaH - boxH)/2;

      if(f.src){
        const im = await carregarImg(f.src);
        // encaixar imagem dentro da caixa 4:3 mantendo proporção (contain)
        let iw = boxW, ih = boxW * (im.height/im.width);
        if(ih > boxH){ ih = boxH; iw = boxH * (im.width/im.height); }
        const ix = boxX + (boxW - iw)/2;
        const iy = boxY + (boxH - ih)/2;
        // moldura da caixa 4:3
        pdf.setDrawColor(195,204,214); pdf.setLineWidth(0.3);
        pdf.setFillColor(238,242,246);
        pdf.rect(boxX, boxY, boxW, boxH, "FD");
        let fmt = f.src.includes("image/png") ? "PNG" : "JPEG";
        pdf.addImage(f.src, fmt, ix, iy, iw, ih);
      } else {
        pdf.setDrawColor(195,204,214);
        pdf.rect(boxX, boxY, boxW, boxH);
      }

      // Legenda
      const legY = blocoTop + blocoH - legendaH + 2;
      pdf.setDrawColor(154,167,181); pdf.setLineWidth(0.3);
      pdf.rect(mL, legY, contentW, legendaH-3);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
      pdf.setTextColor(36,52,71);
      const texto = f.legenda || "";
      const linhas = pdf.splitTextToSize(texto, contentW-6);
      pdf.text(linhas.slice(0,3), mL+3, legY+4);
    }
    desenharRodape();
  }

  const nome = (document.getElementById("cfgImovel").value || "relatorio")
    .replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"_") || "relatorio";
  pdf.save("Relatorio_Fotografico_"+nome+".pdf");
}

render();
</script>
